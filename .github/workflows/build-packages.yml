name: Build Packages

on:
  workflow_call:
    inputs:
      commit:
        type: string
        description: Commit to build. Defaults to the caller's checkout.

permissions:
  contents: read

jobs:
  build:
    name: Build iOS and macOS
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build iOS archive
        run: |
          xcodebuild archive \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project mankai.xcodeproj \
            -scheme mankai \
            -configuration Release \
            -archivePath "$PWD/build/mankai-ios.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/Payload build/releases
          ditto build/mankai-ios.xcarchive/Products/Applications/mankai.app build/ios/Payload/mankai.app
          cd build/ios
          zip -r -q ../releases/mankai.ipa Payload

      - name: Build Mac Catalyst app
        run: |
          xcodebuild build \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project mankai.xcodeproj \
            -scheme mankai \
            -configuration Release \
            -derivedDataPath "$PWD/build/macos" \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Create macOS DMG
        run: |
          mkdir -p build/releases
          npx create-dmg \
            "$PWD/build/macos/Build/Products/Release-maccatalyst/mankai.app" \
            "$PWD/build/releases" \
            --overwrite \
            --no-code-sign \
            --no-version-in-filename
          mv build/releases/Mankai.dmg build/releases/mankai.dmg
          hdiutil verify build/releases/mankai.dmg

      - name: Upload builds
        uses: actions/upload-artifact@v7
        with:
          name: mankai-${{ github.run_id }}
          path: |
            build/releases/mankai.ipa
            build/releases/mankai.dmg
          if-no-files-found: error
          overwrite: true
          compression-level: 0
