name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS and macOS
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2-beta"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build iOS archive
        run: |
          xcodebuild archive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project mankai.xcodeproj \
            -scheme mankai \
            -configuration Release \
            -archivePath "$PWD/build/mankai-ios.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/Payload build/releases
          ditto build/mankai-ios.xcarchive/Products/Applications/mankai.app build/ios/Payload/mankai.app
          cd build/ios
          zip -r -q ../releases/mankai.ipa Payload

      - name: Build Mac Catalyst app
        run: |
          xcodebuild build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project mankai.xcodeproj \
            -scheme mankai \
            -configuration Release \
            -derivedDataPath "$PWD/build/macos" \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Create macOS DMG
        run: |
          mkdir -p build/releases
          npx create-dmg \
            "$PWD/build/macos/Build/Products/Release-maccatalyst/mankai.app" \
            "$PWD/build/releases" \
            --overwrite \
            --no-code-sign \
            --no-version-in-filename
          mv build/releases/Mankai.dmg build/releases/mankai.dmg
          hdiutil verify build/releases/mankai.dmg

      - name: Upload builds
        uses: actions/upload-artifact@v7
        with:
          name: mankai-${{ github.run_id }}
          path: |
            build/releases/mankai.ipa
            build/releases/mankai.dmg
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  release:
    name: Publish tagged release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          name: mankai-${{ github.run_id }}
          path: releases

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s releases/mankai.ipa
          test -s releases/mankai.dmg
          release_flags=()
          case "$RELEASE_TAG" in
            *-alpha.*|*-beta.*|*-rc.*)
              release_flags=(--prerelease --latest=false)
              ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" releases/mankai.ipa releases/mankai.dmg --clobber
            if [ "${#release_flags[@]}" -gt 0 ]; then
              gh release edit "$RELEASE_TAG" "${release_flags[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" releases/mankai.ipa releases/mankai.dmg \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG" \
              "${release_flags[@]}"
          fi
