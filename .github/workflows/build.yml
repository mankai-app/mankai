name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-packages.yml

  release:
    name: Publish tagged release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          name: mankai-${{ github.run_id }}
          path: releases

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s releases/mankai.ipa
          test -s releases/mankai.dmg
          release_flags=()
          case "$RELEASE_TAG" in
            *-alpha.*|*-beta.*|*-rc.*)
              release_flags=(--prerelease --latest=false)
              ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" releases/mankai.ipa releases/mankai.dmg --clobber
            if [ "${#release_flags[@]}" -gt 0 ]; then
              gh release edit "$RELEASE_TAG" "${release_flags[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" releases/mankai.ipa releases/mankai.dmg \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG" \
              "${release_flags[@]}"
          fi
